<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>The Crownless King — Act I</title>
  <link rel="stylesheet" href="style.css" />
  <!-- Act I entry page with the story's first choice. -->
  <script src="theme-toggle.js" defer></script>
</head>
<body>
  <div class="page-shell">
    <header>
      <p class="scene-label">Act I</p>
      <h1>The Crownless King</h1>
    </header>
    <div class="scene-art">
      <img src="hide-or-take-arms.png" alt="Scene illustration placeholder" />
    </div>
    <main>
      <section class="scene-copy">
        <p>A storm rends the sky as invaders breach the palace. The throne room trembles under the weight of war.</p>
      </section>
      <nav class="choice-list">
        <a href="hide.html" class="choice safe">Hide in your chambers</a>
        <a href="fight.html" class="choice risky">Take arms with your soldiers</a>
      </nav>
      <footer class="scene-footer">
        <p>Choose carefully. The kingdom will not forgive a lost moment.</p>
      </footer>
      <div class="theme-switcher" role="group" aria-label="Color theme selector">
        <span>Theme</span>
        <button type="button" data-theme="dark" aria-pressed="false">Dark</button>
        <button type="button" data-theme="light" aria-pressed="false">Light</button>
        <button type="button" data-theme="auto" aria-pressed="false">Auto</button>
      </div>
      <nav class="story-navigator" aria-label="Story tools">
        <a href="about.html">About</a>
        <a href="index.html">Restart Story</a>
        <a href="start.html">Restart Act</a>
        <a href="credits.html">Credits</a>
      </nav>
    </main>
  </div>

</html>
