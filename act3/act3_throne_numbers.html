<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Act III - Throne Room (Numbers Gathered)</title>
  <link rel="stylesheet" href="../style.css" />
  <!-- Final convergence with strong enough support to unlock all ending routes. -->
  <script src="../theme-toggle.js" defer></script>
</head>
<body>
  <div class="page-shell">
    <header>
      <p class="scene-label">Act III - Final Convergence</p>
      <h1>The Cracked Throne</h1>
    </header>
    <main>
      <section class="scene-copy">
        <p>The throne hall reeks of iron and rainwater. Your banners and the tyrant's deadlock under shattered glass.</p>
      </section>
      <nav class="choice-list">
        <a id="to-final-battle" href="act3_party_select_easy.html?party=brann,elya,harold,maven&difficulty=easy&bannersRallied=1" class="choice safe">Lock in companions and march to the throne</a>
      </nav>
      <div class="theme-switcher" role="group" aria-label="Color theme selector">
        <span>Theme</span>
        <button type="button" data-theme="dark" aria-pressed="false">Dark</button>
        <button type="button" data-theme="light" aria-pressed="false">Light</button>
        <button type="button" data-theme="auto" aria-pressed="false">Auto</button>
      </div>
      <nav class="story-navigator" aria-label="Story tools">
        <a href="../about.html">About</a>
        <a href="../index.html">Restart Story</a>
        <a href="act3_start.html">Restart Act</a>
        <a href="../credits.html">Credits</a>
      </nav>
    </main>
  </div>
  <script>
    (function () {
      var params = new URLSearchParams(window.location.search);
      var difficulty = params.get('difficulty') || 'easy';
      var banners = params.get('bannersRallied') || '1';
      var party = params.get('party');

      var link = document.getElementById('to-final-battle');
      if (link) {
        if (difficulty === 'hard') {
          link.href = banners === '1' ? 'act3_party_select_hard_solo_word.html' : 'act3_party_select_hard_solo.html';
          return;
        }

        var selectParams = new URLSearchParams();
        selectParams.set('difficulty', difficulty);
        selectParams.set('bannersRallied', banners);
        selectParams.set('party', party !== null && party !== '' ? party : 'brann,elya,harold,maven');
        link.href = 'act3_party_select_easy.html?' + selectParams.toString();
      }
    })();
  </script>
</body>
</html>
